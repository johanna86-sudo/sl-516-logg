name: Logga buss 516 (morgon + eftermiddag)

on:
  schedule:
    # Var 5:e minut, 03:00-08:59 och 13:00-18:59 UTC, mån-fre.
    # Täcker morgonfönstret 05:45-09:15 och eftermiddagsfönstret 15:15-18:50
    # lokal tid, oavsett sommar-/vintertid — exakt filtrering sker sedan
    # per bevakning inuti monitor.py (se WATCHES).
    - cron: "*/5 3-8,13-18 * * 1-5"
  workflow_dispatch: {}  # gör det möjligt att köra manuellt för test

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kör mätning
        run: python monitor.py

      - name: Committa ny data (om något ändrats)
        run: |
          git config user.name "sl-516-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Logg: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
