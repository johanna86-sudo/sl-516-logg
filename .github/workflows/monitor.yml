name: Logga buss 516 mot Häggvik

on:
  schedule:
    - cron: "*/3 13-18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kör mätning
        run: python monitor.py

      - name: Committa ny data (om något ändrats)
        run: |
          git config user.name "sl-516-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Logg: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
