name: Bygg om sammanfattning

# Bara manuell körning - rör aldrig raw-filerna, bygger bara om
# summary.csv för alla bevakningar (se WATCHES i monitor.py) från grunden
# med senaste logiken.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bygg om summary.csv
        run: python rebuild_summary.py

      - name: Committa (om något ändrats)
        run: |
          git config user.name "sl-516-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*/summary.csv
          git diff --cached --quiet || git commit -m "Byggde om summary.csv med senaste logiken"
          git push
